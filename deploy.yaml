apiVersion: apps/v1
kind: Deployment
metadata:
  name: cal-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cal-app
  template:
    metadata:
      labels:
        app: cal-app
    spec:
      containers:
        - name: cal-app
          image: cal-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: cal-service
spec:
  type: NodePort
  selector:
    app: cal-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
